# Render 蓝图:在 render.com 选 New → Blueprint → 选本仓库,即按此文件建服务。
# 详细步骤见 docs/DEPLOY.md(「Gemini 三步上线」一节)。
services:
  - type: web
    name: mingli-server
    runtime: docker
    rootDir: server
    dockerfilePath: ./Dockerfile
    # free 档会在空闲 15 分钟后休眠、首个请求慢几十秒;正式对外建议 starter
    plan: free
    region: singapore
    healthCheckPath: /healthz
    envVars:
      # ---- 模型:默认 Gemini。两个 key 都是在 Render 面板里手填,不会写进仓库 ----
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      # 2026-11-15 从 gemini-3.8-flash 换到 flash-lite。原因是免费层的每日配额按模型算,
      # 3.8-flash 只有 20 次/天(AI Studio 的 rate limit 页实测:5 RPM / 250K TPM / 20 RPD),
      # 12 个封闭测试的人一天就能用光。flash-lite 是官方口径里"最快、最省、面向高吞吐"的那档,
      # 顺带也能缓解超时——详见 GEMINI_THINKING_LEVEL 上面那段。
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      # 想同时开 Claude 就填这个;留空则 /v1/interpret 里指定 provider=claude 会返回 503
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CLAUDE_MODEL
        value: claude-opus-5
      - key: CLAUDE_EFFORT
        value: high
      # 别为了提速调小这个值:思考 token 也算在 maxOutputTokens 里,调小的后果是
      # 模型"想"到一半就被截断,返回空文本(gemini.ts 会抛「Gemini 返回空文本」),
      # 而不是更快出结果。官方建议降 thinkingLevel 而不是砍 maxOutputTokens
      # ——见下面的 GEMINI_THINKING_LEVEL。
      - key: LLM_MAX_TOKENS
        value: "6000"
      # 思考深度(只影响「更多 AI 解读」那条路径,主解读固定走 MEDIUM,见 gemini.ts)。
      # 取值 MINIMAL/LOW/MEDIUM/HIGH/XHIGH,注意是大写;留空则完全不发 thinkingConfig
      # (换回 Gemini 2.x 这类不支持思考的模型时必须留空,否则直接报错)。
      # MINIMAL 在 gemini-3.5-flash-lite 上可用(3.8-flash 不支持,换回去要改成 LOW)。
      # 这里压到最低是因为客户端 60 秒就超时,而实测慢的那部分几乎全在思考上。
      - key: GEMINI_THINKING_LEVEL
        value: "MINIMAL"
      # ---- 访问控制 ----
      # Render 自动生成一个随机口令;网页版由 GitHub Actions 用仓库密钥 MINGLI_APP_TOKEN 带进去,
      # 原生版编译时用 --dart-define=MINGLI_APP_TOKEN=<这个值>
      - key: APP_TOKEN
        generateValue: true
      # 只放行网页版的来源;本地调试或加其他前端时用逗号追加
      - key: CORS_ORIGINS
        value: https://firedragonai.github.io
      - key: RATE_LIMIT_PER_10MIN
        value: "30"
      - key: CACHE_TTL_DAYS
        value: "7"
      - key: LOG_LEVEL
        value: info
