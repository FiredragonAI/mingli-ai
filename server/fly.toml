# Fly.io 配置(Render 的替代方案,命令行操作,见 docs/DEPLOY.md)。
# 部署:cd server && fly launch --copy-config --no-deploy && fly secrets set ANTHROPIC_API_KEY=… APP_TOKEN=… && fly deploy
app = "mingli-server"
primary_region = "hkg"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  CLAUDE_MODEL = "claude-opus-5"
  CLAUDE_EFFORT = "high"
  CLAUDE_MAX_TOKENS = "6000"
  RATE_LIMIT_PER_10MIN = "30"
  CACHE_TTL_DAYS = "7"
  LOG_LEVEL = "info"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
